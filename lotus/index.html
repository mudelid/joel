<!doctype html>
<html lang="et">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LOTUS</title>
  

  <style>
    @font-face {
      font-family:'BebasKai';
      src:url('../fonts/bebaskai.woff2') format('woff2'),
          url('../fonts/bebaskai.woff') format('woff');
      font-weight:normal;
      font-style:normal;
    }

    :root{
      --text:#000;
      --border:#000;
      --panel:#fff;
      --maxw:1050px;
    }

    *{ box-sizing:border-box; }

    html{
      min-height:100%;
      scroll-behavior:smooth;
      overflow-x:hidden;
    }

    body{
      margin:0;
      min-height:100%;
      overflow-x:hidden;
      background:url("../img/taust3.jpg?v=2") no-repeat center center fixed;
      background-size:cover;
      color:var(--text);
      font-family:'BebasKai',sans-serif;
    }

    body.lb-open{ overflow:hidden; }

    .site-logo{
      position:fixed;
      top:18px;
      left:18px;
      z-index:1200;
      width:120px;
      height:120px;
      display:block;
      border:1px solid #000;
      border-radius:14px;
      overflow:hidden;
      background:#fff;
      box-shadow:0 5px 18px rgba(0,0,0,.14);
      transition:width .28s ease,height .28s ease,top .28s ease,left .28s ease,border-radius .28s ease;
    }

    .site-logo img{
      width:100%;
      height:100%;
      display:block;
      object-fit:cover;
    }

    .site-logo.is-small{
      width:30px;
      height:30px;
      top:10px;
      left:10px;
      border-radius:7px;
    }

    .page-header{
      max-width:var(--maxw);
      margin:0 auto;
      padding:42px 16px 16px;
      text-align:center;
    }

    .back{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-height:42px;
      margin-bottom:14px;
      padding:8px 14px;
      border:1px solid #000;
      border-radius:999px;
      background:#fff;
      color:#000;
      text-decoration:none;
      font-size:18px;
      box-shadow:0 3px 10px rgba(0,0,0,.07);
      transition:transform .18s ease,background .18s ease;
    }

    .back:hover{
      background:#f2f2f2;
      transform:translateY(-1px);
    }

    h1{
      margin:0;
      font-size:72px;
      line-height:.95;
      letter-spacing:.6px;
    }

    .count-label{
      margin:14px 0 7px;
      font-size:20px;
      line-height:1;
    }

    .flip-counter{
      display:flex;
      justify-content:center;
      gap:6px;
      min-height:58px;
      margin:0 auto 12px;
    }

    .flip-digit{
      position:relative;
      width:44px;
      height:56px;
      border:1px solid #000;
      border-radius:8px;
      background:#fff;
      box-shadow:0 3px 9px rgba(0,0,0,.11);
      overflow:hidden;
      perspective:400px;
    }

    .flip-digit::after{
      content:"";
      position:absolute;
      left:0;
      right:0;
      top:50%;
      height:1px;
      background:#000;
      opacity:.55;
      z-index:3;
      pointer-events:none;
    }

    .flip-digit .digit{
      position:absolute;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:44px;
      line-height:1;
      padding-top:3px;
      transform-origin:center bottom;
      backface-visibility:hidden;
    }

    .flip-digit.animate .digit{
      animation:flipIn .6s cubic-bezier(.2,.7,.2,1);
    }

    @keyframes flipIn{
      0%{ transform:rotateX(-90deg); opacity:.15; }
      65%{ transform:rotateX(12deg); opacity:1; }
      100%{ transform:rotateX(0); opacity:1; }
    }

    .lead{
      margin:8px 0 0;
      font-size:18px;
      opacity:.7;
    }

    main{
      max-width:var(--maxw);
      margin:10px auto 55px;
      padding:0 16px;
      display:grid;
      gap:12px;
      grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
    }

    .card{
      position:relative;
      overflow:hidden;
      border:1px solid #000;
      border-radius:14px;
      background:rgba(255,255,255,.97);
      box-shadow:0 3px 10px rgba(0,0,0,.07);
      transition:transform .18s ease,box-shadow .18s ease,background .18s ease;
    }

    .card:hover{
      transform:translateY(-3px);
      box-shadow:0 6px 15px rgba(0,0,0,.12);
      background:#f5f5f5;
    }

    .thumb{
      aspect-ratio:4/3;
      width:100%;
      object-fit:cover;
      display:block;
      background:#222;
      cursor:zoom-in;
    }

    .card .content{
      padding:9px 11px 11px;
      text-align:center;
    }

    .card .title{
      margin:0 0 5px;
      font-size:23px;
      line-height:1.05;
    }

    .card .desc{
      margin:0;
      font-size:14px;
      line-height:1.15;
      opacity:.66;
    }

    .info-btn{
      position:absolute;
      z-index:4;
      top:8px;
      left:8px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding:5px 9px;
      border:1px solid #000;
      border-radius:999px;
      background:rgba(255,255,255,.88);
      color:#000;
      text-decoration:none;
      font-family:'BebasKai',sans-serif;
      font-size:14px;
      line-height:1;
      box-shadow:0 2px 6px rgba(0,0,0,.12);
    }

    .info-btn:hover{ background:#fff; }

    #info-popover{
      position:fixed;
      z-index:12000;
      display:none;
      width:min(420px,calc(100vw - 24px));
      padding:12px 14px;
      border:1px solid #000;
      border-radius:12px;
      background:rgba(255,255,255,.99);
      color:#000;
      box-shadow:0 12px 40px rgba(0,0,0,.24);
      font-family:system-ui,-apple-system,Segoe UI,sans-serif;
      font-size:14px;
      line-height:1.3;
    }

    #info-popover.show{ display:block; }
    #info-popover .t{ font-weight:700; margin:0 28px 7px 0; }
    #info-popover .x{
      position:absolute;
      top:7px;
      right:8px;
      border:0;
      background:transparent;
      color:#000;
      cursor:pointer;
      font-size:18px;
    }
    #info-popover .more{ margin-top:8px; }
    #info-popover .more a{ color:#000; }

    #lb-overlay{
      position:fixed;
      inset:0;
      z-index:10000;
      display:none;
      align-items:center;
      justify-content:center;
      padding:60px 70px 70px;
      background:rgba(0,0,0,.88);
      backdrop-filter:blur(4px);
      -webkit-backdrop-filter:blur(4px);
    }

    #lb-overlay.open{ display:flex; }

    #lb-stage{
      position:relative;
      width:calc(100vw - 140px);
      height:calc(100vh - 130px);
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
      touch-action:none;
      cursor:grab;
    }

    #lb-stage.dragging{ cursor:grabbing; }

    #lb-img{
      max-width:100%;
      max-height:100%;
      object-fit:contain;
      border-radius:12px;
      box-shadow:0 12px 45px rgba(0,0,0,.55);
      transform-origin:center center;
      will-change:transform;
      user-select:none;
      -webkit-user-drag:none;
      touch-action:none;
    }

    #lb-info{
      position:fixed;
      left:50%;
      bottom:16px;
      transform:translateX(-50%);
      z-index:10003;
      width:min(90vw,900px);
      padding:6px 11px;
      border:1px solid rgba(255,255,255,.45);
      border-radius:999px;
      background:rgba(0,0,0,.36);
      color:#fff;
      text-align:center;
      font-size:22px;
      line-height:1;
      backdrop-filter:blur(4px);
      pointer-events:none;
    }

    #lb-close,
    #lb-back{
      position:fixed;
      top:16px;
      z-index:10002;
      min-height:40px;
      border:1px solid rgba(255,255,255,.55);
      border-radius:11px;
      background:rgba(255,255,255,.14);
      color:#fff;
      cursor:pointer;
      backdrop-filter:blur(4px);
    }

    #lb-close{
      right:16px;
      width:42px;
      font-size:22px;
    }

    #lb-back{
      left:16px;
      padding:7px 12px;
      font-family:'BebasKai',sans-serif;
      font-size:17px;
    }

    .lb-arrow{
      position:fixed;
      top:50%;
      z-index:10002;
      transform:translateY(-50%);
      width:48px;
      height:58px;
      border:1px solid rgba(255,255,255,.5);
      border-radius:12px;
      background:rgba(255,255,255,.14);
      color:#fff;
      font-size:32px;
      cursor:pointer;
      backdrop-filter:blur(4px);
    }

    #lb-prev{ left:16px; }
    #lb-next{ right:16px; }


    .brand-arrow{
      position:fixed;
      top:50%;
      z-index:9000;
      transform:translateY(-50%);
      display:flex;
      align-items:center;
      justify-content:center;
      width:46px;
      height:52px;
      border:1px solid rgba(255,255,255,.45);
      border-radius:12px;
      background:rgba(0,0,0,.36);
      color:#fff !important;
      text-decoration:none !important;
      font-size:31px;
      backdrop-filter:blur(5px);
    }

    #brand-prev{ left:12px; }
    #brand-next{ right:12px; }

    .brand-pill{
      position:fixed;
      left:50%;
      bottom:max(10px,env(safe-area-inset-bottom));
      z-index:9000;
      transform:translateX(-50%);
      display:none;
      width:min(94vw,560px);
      padding:7px 9px;
      border:1px solid rgba(255,255,255,.42);
      border-radius:999px;
      background:rgba(0,0,0,.42);
      backdrop-filter:blur(7px);
    }

    .brand-pill a{
      flex:1;
      min-width:0;
      display:flex;
      align-items:center;
      gap:7px;
      padding:5px 8px;
      color:#fff !important;
      text-decoration:none !important;
    }

    .brand-pill .right{ justify-content:flex-end; text-align:right; }

    .brand-pill .name{
      overflow:hidden;
      display:-webkit-box;
      -webkit-line-clamp:2;
      -webkit-box-orient:vertical;
      font-size:15px;
      line-height:1;
    }

    .brand-pill .arr{ font-size:25px; line-height:1; }

    .brand-pill .sep{
      width:1px;
      margin:2px;
      background:rgba(255,255,255,.45);
      flex:0 0 1px;
    }

    body.lb-open .brand-arrow,
    body.lb-open .brand-pill{
      display:none !important;
    }

    #to-top{
      position:fixed;
      right:18px;
      bottom:18px;
      z-index:8500;
      width:46px;
      height:46px;
      display:flex;
      align-items:center;
      justify-content:center;
      border:1px solid #000;
      border-radius:50%;
      background:rgba(255,255,255,.94);
      color:#000;
      font-size:26px;
      line-height:1;
      cursor:pointer;
      box-shadow:0 4px 14px rgba(0,0,0,.14);
      opacity:0;
      visibility:hidden;
      transform:translateY(8px);
      transition:opacity .2s ease,visibility .2s ease,transform .2s ease,background .2s ease;
    }

    #to-top.show{
      opacity:1;
      visibility:visible;
      transform:translateY(0);
    }

    #to-top:hover{ background:#f2f2f2; }

    body.lb-open #to-top{ display:none; }

    footer{
      max-width:var(--maxw);
      margin:0 auto 35px;
      padding:0 16px;
      text-align:center;
      font-size:18px;
    }

    @media(max-width:800px){
      body{ background-attachment:scroll; padding-bottom:68px; }

      .site-logo{
        width:92px;
        height:92px;
        top:10px;
        left:10px;
        border-radius:11px;
      }

      .site-logo.is-small{
        width:24px;
        height:24px;
        top:8px;
        left:8px;
        border-radius:5px;
      }

      .page-header{ padding:116px 12px 12px; }
      h1{ font-size:48px; }

      .count-label{
        margin-top:11px;
        font-size:17px;
      }

      .flip-counter{
        min-height:48px;
        gap:4px;
        margin-bottom:10px;
      }

      .flip-digit{
        width:37px;
        height:47px;
        border-radius:7px;
      }

      .flip-digit .digit{
        font-size:37px;
      }

      main{
        padding:0 10px;
        grid-template-columns:repeat(2,minmax(0,1fr));
        gap:8px;
      }

      .card{ border-radius:11px; }
      .card .content{ padding:7px 8px 9px; }
      .card .title{ font-size:17px; }
      .card .desc{ font-size:12px; }
      .info-btn{ top:6px; left:6px; padding:4px 7px; font-size:12px; }

      .brand-arrow{ display:none; }
      .brand-pill{ display:flex; }

      #lb-overlay{ padding:58px 10px 80px; }
      #lb-stage{
        width:100vw;
        height:calc(100vh - 138px);
      }
      #lb-img{
        max-width:96vw;
        max-height:76vh;
      }
      #lb-info{
        bottom:72px;
        width:calc(100vw - 24px);
        padding:6px 9px;
        font-size:16px;
      }

      #to-top{
        right:12px;
        bottom:76px;
        width:40px;
        height:40px;
        font-size:23px;
      }

      .lb-arrow{
        top:auto;
        bottom:20px;
        transform:none;
        width:48px;
        height:44px;
      }

      #lb-prev{ left:18px; }
      #lb-next{ right:18px; }
      #lb-back{ font-size:15px; }
    }
  </style>
</head>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    (() => {
      const logo = document.getElementById('siteLogo');
      function updateLogo(){
        logo?.classList.toggle('is-small', window.scrollY > 70);
      }
      updateLogo();
      window.addEventListener('scroll', updateLogo, {passive:true});
    })();

    /* MUDELITE ARV – flip-counter */
    (() => {
      const counter = document.getElementById('modelCounter');
      if (!counter) return;

      const total = document.querySelectorAll('main .card').length;
      const digits = String(total).split('');

      counter.innerHTML = digits.map(d => `
        <div class="flip-digit">
          <span class="digit">${d}</span>
        </div>
      `).join('');

      requestAnimationFrame(() => {
        counter.querySelectorAll('.flip-digit').forEach((el, i) => {
          setTimeout(() => el.classList.add('animate'), i * 80);
        });
      });

      counter.setAttribute('aria-label', `Kokku ${total} mudelit`);
    })();

    /* TAGASI ÜLES */
    (() => {
      const btn = document.createElement('button');
      btn.id = 'to-top';
      btn.type = 'button';
      btn.setAttribute('aria-label', 'Tagasi üles');
      btn.textContent = '↑';
      document.body.appendChild(btn);

      function update(){
        btn.classList.toggle('show', window.scrollY > 500);
      }

      btn.addEventListener('click', () => {
        window.scrollTo({top:0, behavior:'smooth'});
      });

      update();
      window.addEventListener('scroll', update, {passive:true});
    })();

    /* LIGHTBOX + täpne ?img= identifikaator */
    (() => {
      const cards = [...document.querySelectorAll('.card')];

      const overlay = document.createElement('div');
      overlay.id = 'lb-overlay';
      overlay.innerHTML = `
        <button id="lb-close" type="button" aria-label="Sulge">×</button>
        <button id="lb-back" type="button" aria-label="Tagasi">← TAGASI</button>
        <button class="lb-arrow" id="lb-prev" type="button" aria-label="Eelmine">‹</button>
        <div id="lb-stage">
          <img id="lb-img" alt="">
        </div>
        <button class="lb-arrow" id="lb-next" type="button" aria-label="Järgmine">›</button>
        <div id="lb-info" aria-live="polite"></div>
      `;
      document.body.appendChild(overlay);

      const stageEl = overlay.querySelector('#lb-stage');
      const imgEl = overlay.querySelector('#lb-img');
      const infoEl = overlay.querySelector('#lb-info');
      const prevBtn = overlay.querySelector('#lb-prev');
      const nextBtn = overlay.querySelector('#lb-next');
      const closeBtn = overlay.querySelector('#lb-close');
      const backBtn = overlay.querySelector('#lb-back');

      function modelLabel(card){
        return (
          card.dataset?.model ||
          card.querySelector('.title, .model-name, h3, h2')?.textContent ||
          card.querySelector('img')?.alt ||
          ''
        ).trim();
      }

      function fullSrc(card){
        const img = card.querySelector('img.thumb, img');
        const link = card.querySelector('a[href]');
        return (
          img?.getAttribute('data-full') ||
          link?.getAttribute('href') ||
          img?.getAttribute('src') ||
          ''
        );
      }

      function fileName(src){
        try{
          const u = new URL(src, location.href);
          return decodeURIComponent(u.pathname.split('/').pop() || '').toLowerCase();
        }catch{
          return (src.split('/').pop() || '').split('?')[0].toLowerCase();
        }
      }

      /* ZOOM + PAN */
      let zoom = 1;
      let panX = 0;
      let panY = 0;
      const MIN_ZOOM = 1;
      const MAX_ZOOM = 5;

      let dragging = false;
      let dragStartX = 0;
      let dragStartY = 0;
      let dragBaseX = 0;
      let dragBaseY = 0;
      let movedDuringDrag = false;

      let pinchStartDistance = null;
      let pinchStartZoom = 1;
      let touchPanStartX = 0;
      let touchPanStartY = 0;
      let touchBaseX = 0;
      let touchBaseY = 0;

      function clamp(value, min, max){
        return Math.max(min, Math.min(max, value));
      }

      function updateInfo(){
        if (!infoEl || !gallery.length) return;
        const item = gallery[current];
        infoEl.textContent = `${item.label} · ${current + 1} / ${gallery.length} · ${zoom.toFixed(1)}×`;
      }

      function applyTransform(){
        imgEl.style.transform = `translate(${panX}px, ${panY}px) scale(${zoom})`;
        updateInfo();
      }

      function updateModelUrl(item){
        const url = new URL(location.href);
        url.searchParams.delete('m');
        url.searchParams.set('img', item.file);
        /* from=daily / from=recent ja muud parameetrid jäävad alles. */
        history.replaceState({}, '', url.pathname + url.search + url.hash);
      }

      function resetZoom(){
        zoom = 1;
        panX = 0;
        panY = 0;
        dragging = false;
        movedDuringDrag = false;
        stageEl?.classList.remove('dragging');
        applyTransform();
      }

      function setZoom(nextZoom, clientX=null, clientY=null){
        const oldZoom = zoom;
        nextZoom = clamp(nextZoom, MIN_ZOOM, MAX_ZOOM);
        if (Math.abs(nextZoom - oldZoom) < 0.001) return;

        if (clientX !== null && clientY !== null && stageEl){
          const rect = stageEl.getBoundingClientRect();
          const cx = clientX - rect.left - rect.width / 2;
          const cy = clientY - rect.top - rect.height / 2;
          const ratio = nextZoom / oldZoom;

          panX = cx - (cx - panX) * ratio;
          panY = cy - (cy - panY) * ratio;
        }

        zoom = nextZoom;

        if (zoom <= 1.001){
          zoom = 1;
          panX = 0;
          panY = 0;
        }

        applyTransform();
      }

      function distance(t1, t2){
        return Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
      }

      /* Desktop: hiirerull */
      stageEl?.addEventListener('wheel', e => {
        e.preventDefault();
        const factor = e.deltaY < 0 ? 1.18 : (1 / 1.18);
        setZoom(zoom * factor, e.clientX, e.clientY);
      }, {passive:false});

      /* Topeltklõps: 1× <-> 2.5× */
      stageEl?.addEventListener('dblclick', e => {
        e.preventDefault();
        if (zoom > 1.05) resetZoom();
        else setZoom(2.5, e.clientX, e.clientY);
      });

      /* Desktop: zoomitud pilti saab lohistada */
      stageEl?.addEventListener('pointerdown', e => {
        if (e.pointerType === 'touch' || zoom <= 1) return;

        dragging = true;
        movedDuringDrag = false;
        dragStartX = e.clientX;
        dragStartY = e.clientY;
        dragBaseX = panX;
        dragBaseY = panY;
        stageEl.setPointerCapture?.(e.pointerId);
        stageEl.classList.add('dragging');
        e.preventDefault();
      });

      stageEl?.addEventListener('pointermove', e => {
        if (!dragging || e.pointerType === 'touch') return;

        const dx = e.clientX - dragStartX;
        const dy = e.clientY - dragStartY;
        if (Math.abs(dx) > 3 || Math.abs(dy) > 3) movedDuringDrag = true;

        panX = dragBaseX + dx;
        panY = dragBaseY + dy;
        applyTransform();
      });

      function endDrag(e){
        if (!dragging) return;
        dragging = false;
        stageEl?.classList.remove('dragging');
        try{ stageEl?.releasePointerCapture?.(e.pointerId); }catch{}
      }

      stageEl?.addEventListener('pointerup', endDrag);
      stageEl?.addEventListener('pointercancel', endDrag);

      /* Telefon: pinch-to-zoom + ühe sõrmega pan */
      stageEl?.addEventListener('touchstart', e => {
        if (e.touches.length === 2){
          pinchStartDistance = distance(e.touches[0], e.touches[1]);
          pinchStartZoom = zoom;
          e.preventDefault();
        } else if (e.touches.length === 1 && zoom > 1){
          touchPanStartX = e.touches[0].clientX;
          touchPanStartY = e.touches[0].clientY;
          touchBaseX = panX;
          touchBaseY = panY;
          e.preventDefault();
        }
      }, {passive:false});

      stageEl?.addEventListener('touchmove', e => {
        if (e.touches.length === 2 && pinchStartDistance){
          const dist = distance(e.touches[0], e.touches[1]);
          const nextZoom = pinchStartZoom * (dist / pinchStartDistance);
          const centerX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
          const centerY = (e.touches[0].clientY + e.touches[1].clientY) / 2;

          setZoom(nextZoom, centerX, centerY);
          e.preventDefault();

        } else if (e.touches.length === 1 && zoom > 1){
          panX = touchBaseX + (e.touches[0].clientX - touchPanStartX);
          panY = touchBaseY + (e.touches[0].clientY - touchPanStartY);
          applyTransform();
          e.preventDefault();
        }
      }, {passive:false});

      stageEl?.addEventListener('touchend', e => {
        if (e.touches.length < 2) pinchStartDistance = null;
      });

      const gallery = cards.map(card => {
        const src = fullSrc(card);
        if (!src) return null;
        return { card, src, file:fileName(src), label:modelLabel(card) };
      }).filter(Boolean);

      if (!gallery.length) return;

      let current = 0;

      function openAt(index){
        current = (index + gallery.length) % gallery.length;
        const item = gallery[current];

        resetZoom();
        imgEl.src = item.src;
        imgEl.alt = item.label;
        updateInfo();
        updateModelUrl(item);

        overlay.classList.add('open');
        document.body.classList.add('lb-open');

        const single = gallery.length < 2;
        prevBtn.style.display = single ? 'none' : '';
        nextBtn.style.display = single ? 'none' : '';

        if (!single){
          const prePrev = new Image();
          prePrev.src = gallery[(current - 1 + gallery.length) % gallery.length].src;
          const preNext = new Image();
          preNext.src = gallery[(current + 1) % gallery.length].src;
        }
      }

      function close(){
        resetZoom();
        overlay.classList.remove('open');
        document.body.classList.remove('lb-open');
        imgEl.src = '';

        const clean = new URL(location.href);
        clean.searchParams.delete('img');
        clean.searchParams.delete('m');
        history.replaceState({}, '', clean.pathname + clean.search + clean.hash);
      }

      cards.forEach(card => {
        const clickable = card.querySelector('img.thumb, img');
        if (!clickable) return;

        clickable.addEventListener('click', e => {
          e.preventDefault();
          e.stopPropagation();
          const idx = gallery.findIndex(x => x.card === card);
          if (idx >= 0) openAt(idx);
        });
      });

      closeBtn.addEventListener('click', close);
      prevBtn.addEventListener('click', e => { e.stopPropagation(); openAt(current - 1); });
      nextBtn.addEventListener('click', e => { e.stopPropagation(); openAt(current + 1); });
      overlay.addEventListener('click', e => { if (e.target === overlay) close(); });

      backBtn.addEventListener('click', () => {
        const params = new URLSearchParams(location.search);
        const from = params.get('from');

        if (from === 'recent'){
          location.href = '../hiljutised.html';
          return;
        }

        if (from === 'daily'){
          location.href = '../index.html#daily';
          return;
        }

        /* Otse tootjalehel avatud pildi puhul sulgeme lihtsalt lightboxi. */
        close();
      });

      window.addEventListener('keydown', e => {
        if (!overlay.classList.contains('open')) return;
        if (e.key === 'Escape') close();
        if (e.key === 'ArrowLeft') openAt(current - 1);
        if (e.key === 'ArrowRight') openAt(current + 1);
      });

      const params = new URLSearchParams(location.search);
      const wantedImg = (params.get('img') || '').trim().toLowerCase();
      const wantedModel = (params.get('m') || '').trim().toLowerCase();

      if (wantedImg){
        const idx = gallery.findIndex(x => x.file === fileName(wantedImg));
        if (idx >= 0) openAt(idx);
      } else if (wantedModel){
        let idx = gallery.findIndex(x => (x.label || '').toLowerCase() === wantedModel);
        if (idx < 0) {
          idx = gallery.findIndex(x => (x.label || '').toLowerCase().includes(wantedModel));
        }
        if (idx >= 0) openAt(idx);
      }
    })();

    /* LISAINFO */
    (() => {
      const cards = [...document.querySelectorAll('.card[data-info]')];

      cards.forEach(card => {
        const url = (card.dataset.info || '').trim();
        const custom = (card.querySelector('.info-text')?.innerHTML || '').trim();

        if (!url && !custom) return;
        if (card.querySelector('.info-btn')) return;

        const btn = document.createElement('a');
        btn.className = 'info-btn';
        btn.href = url || '#';
        btn.textContent = 'LISAINFO';
        card.appendChild(btn);
      });

      const buttons = [...document.querySelectorAll('.info-btn')];
      if (!buttons.length) return;

      const pop = document.createElement('div');
      pop.id = 'info-popover';
      pop.innerHTML = `
        <button class="x" type="button" aria-label="Sulge">×</button>
        <div class="t"></div>
        <div class="body"></div>
        <div class="more"><a target="_blank" rel="noopener">LOE VEEL →</a></div>
      `;
      document.body.appendChild(pop);

      const titleEl = pop.querySelector('.t');
      const bodyEl = pop.querySelector('.body');
      const moreBox = pop.querySelector('.more');
      const moreA = pop.querySelector('.more a');
      const x = pop.querySelector('.x');
      let currentBtn = null;

      function place(btn){
        const r = btn.getBoundingClientRect();
        pop.style.visibility = 'hidden';
        pop.classList.add('show');

        const pr = pop.getBoundingClientRect();
        let left = r.left;
        let top = r.bottom + 8;

        if (left + pr.width > innerWidth - 8) left = innerWidth - pr.width - 8;
        if (left < 8) left = 8;
        if (top + pr.height > innerHeight - 8) top = Math.max(8, r.top - pr.height - 8);

        pop.style.left = left + 'px';
        pop.style.top = top + 'px';
        pop.style.visibility = '';
      }

      function show(btn){
        const card = btn.closest('.card');
        const title = card?.querySelector('.title')?.textContent?.trim() || 'INFO';
        const custom = (card?.querySelector('.info-text')?.innerHTML || '').trim();
        const url = (card?.dataset.info || '').trim();

        titleEl.textContent = title;
        bodyEl.innerHTML = custom || 'Lisainfo';
        moreBox.style.display = url ? '' : 'none';
        if (url) moreA.href = url;

        currentBtn = btn;
        place(btn);
      }

      function hide(){
        pop.classList.remove('show');
        currentBtn = null;
      }

      buttons.forEach(btn => {
        btn.addEventListener('click', e => {
          e.preventDefault();
          e.stopPropagation();
          if (pop.classList.contains('show') && currentBtn === btn) hide();
          else show(btn);
        });
      });

      x.addEventListener('click', hide);

      document.addEventListener('click', e => {
        if (!pop.contains(e.target) && !e.target.closest('.info-btn')) hide();
      });

      window.addEventListener('scroll', () => {
        if (currentBtn && pop.classList.contains('show')) place(currentBtn);
      }, {passive:true});

      window.addEventListener('resize', () => {
        if (currentBtn && pop.classList.contains('show')) place(currentBtn);
      });
    })();

    /* EELMINE / JÄRGMINE TOOTJA */
    (() => {
      if (location.protocol === 'file:') return;

      fetch('../mudelid.html', {cache:'no-store'})
        .then(r => r.ok ? r.text() : Promise.reject())
        .then(html => {
          const doc = new DOMParser().parseFromString(html,'text/html');
          const base = new URL('../mudelid.html', location.href);

          const list = [...doc.querySelectorAll('.brand-card[href]')].map(card => {
            const url = new URL(card.getAttribute('href'), base);
            const path = url.pathname.replace(/index\.html$/, '');
            const slug = path.split('/').filter(Boolean).pop();
            const name = (card.querySelector('.brand-name')?.textContent || slug || '').trim();
            return {url, path, slug, name};
          }).filter(x => x.slug);

          if (list.length < 2) return;

          const here = location.pathname.replace(/index\.html$/, '');
          const slug = here.split('/').filter(Boolean).pop();

          let index = list.findIndex(x => x.path === here);
          if (index < 0) index = list.findIndex(x => x.slug === slug);
          if (index < 0) return;

          const prev = list[(index - 1 + list.length) % list.length];
          const next = list[(index + 1) % list.length];

          const prevA = document.createElement('a');
          prevA.id = 'brand-prev';
          prevA.className = 'brand-arrow';
          prevA.href = prev.url.pathname;
          prevA.textContent = '‹';
          prevA.title = prev.name;

          const nextA = document.createElement('a');
          nextA.id = 'brand-next';
          nextA.className = 'brand-arrow';
          nextA.href = next.url.pathname;
          nextA.textContent = '›';
          nextA.title = next.name;

          const pill = document.createElement('nav');
          pill.className = 'brand-pill';
          pill.innerHTML = `
            <a class="left" href="${prev.url.pathname}">
              <span class="arr">‹</span>
              <span class="name">${escapeHtml(prev.name)}</span>
            </a>
            <span class="sep" aria-hidden="true"></span>
            <a class="right" href="${next.url.pathname}">
              <span class="name">${escapeHtml(next.name)}</span>
              <span class="arr">›</span>
            </a>
          `;

          document.body.append(prevA, nextA, pill);

          function lightboxOpen(){
            return document.getElementById('lb-overlay')?.classList.contains('open');
          }

          window.addEventListener('keydown', e => {
            if (lightboxOpen()) return;
            if (e.key === 'ArrowLeft') location.href = prev.url.pathname;
            if (e.key === 'ArrowRight') location.href = next.url.pathname;
          });

          let sx = null, sy = null;
          window.addEventListener('touchstart', e => {
            const t = e.changedTouches[0];
            sx = t.clientX;
            sy = t.clientY;
          }, {passive:true});

          window.addEventListener('touchend', e => {
            if (lightboxOpen() || sx === null) return;

            const t = e.changedTouches[0];
            const dx = t.clientX - sx;
            const dy = t.clientY - sy;

            if (Math.abs(dx) > 90 && Math.abs(dx) > Math.abs(dy) * 1.35) {
              location.href = dx > 0 ? prev.url.pathname : next.url.pathname;
            }

            sx = sy = null;
          }, {passive:true});
        })
        .catch(() => {});
    })();

    function escapeHtml(value){
      return String(value)
        .replaceAll('&','&amp;')
        .replaceAll('<','&lt;')
        .replaceAll('>','&gt;')
        .replaceAll('"','&quot;')
        .replaceAll("'","&#039;");
    }
  </script>

</body>
