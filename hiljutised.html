<!doctype html>
<html lang="et">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HILJUTI LISATUD</title>
  <style>

@font-face{
  font-family:'BebasKai';
  src:url('fonts/bebaskai.woff2') format('woff2'),
      url('fonts/bebaskai.woff') format('woff');
  font-weight:normal;
  font-style:normal;
}

:root{
  --text:#000;
  --border:#000;
  --maxw:1050px;
}

*{box-sizing:border-box}

html{
  min-height:100%;
  scroll-behavior:smooth;
}

body{
  margin:0;
  min-height:100%;
  background:url("img/taust3.jpg?v=2") no-repeat center center fixed;
  background-size:cover;
  color:var(--text);
  font-family:'BebasKai',sans-serif;
}

body.modal-open{overflow:hidden}

/* LOGO */
.logo{
  position:fixed;
  top:18px;
  left:18px;
  z-index:1000;
  width:120px;
  height:120px;
  display:block;
  border:1px solid #000;
  border-radius:14px;
  overflow:hidden;
  background:#fff;
  box-shadow:0 5px 18px rgba(0,0,0,.14);
  transition:width .28s ease,height .28s ease,top .28s ease,left .28s ease,border-radius .28s ease;
}
.logo img{width:100%;height:100%;display:block;object-fit:cover}
.logo.is-small{
  width:30px;height:30px;top:10px;left:10px;border-radius:7px;
}

/* PÄIS */
header{
  max-width:var(--maxw);
  margin:0 auto;
  padding:42px 16px 12px;
  text-align:center;
}

.back{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:42px;
  margin-bottom:13px;
  padding:8px 14px;
  border:1px solid #000;
  border-radius:999px;
  background:#fff;
  color:#000;
  text-decoration:none;
  font-size:18px;
  box-shadow:0 3px 10px rgba(0,0,0,.07);
  transition:transform .18s ease,background .18s ease;
}
.back:hover{background:#f2f2f2;transform:translateY(-1px)}

h1{
  margin:0;
  font-size:66px;
  line-height:.95;
  letter-spacing:.6px;
}

/* viimase X päeva statistika */
.range-panel{
  width:min(540px,100%);
  margin:18px auto 0;
  padding:14px 15px 16px;
  border:1px solid #000;
  border-radius:14px;
  background:rgba(255,255,255,.97);
  box-shadow:0 3px 10px rgba(0,0,0,.07);
}

.range-controls{
  display:flex;
  align-items:center;
  justify-content:center;
  flex-wrap:wrap;
  gap:7px;
  font-size:20px;
}

#recentRangeSelect{
  min-width:58px;
  height:38px;
  padding:3px 26px 3px 9px;
  border:1px solid #000;
  border-radius:9px;
  background:#fff;
  color:#000;
  font-family:'BebasKai',sans-serif;
  font-size:20px;
  text-align:center;
  cursor:pointer;
  -webkit-appearance:auto;
  appearance:auto;
}

.range-flip-counter{
  display:flex;
  justify-content:center;
  gap:6px;
  min-height:60px;
  margin:12px auto 0;
}

.range-flip-digit{
  position:relative;
  width:45px;
  height:58px;
  border:1px solid #000;
  border-radius:8px;
  background:#fff;
  box-shadow:0 3px 9px rgba(0,0,0,.11);
  overflow:hidden;
  perspective:400px;
}

.range-flip-digit::after{
  content:"";
  position:absolute;
  left:0;
  right:0;
  top:50%;
  height:1px;
  background:#000;
  opacity:.55;
  z-index:3;
  pointer-events:none;
}

.range-flip-digit .digit{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:45px;
  line-height:1;
  padding-top:3px;
  transform-origin:center bottom;
  backface-visibility:hidden;
}

.range-flip-digit.animate .digit{
  animation:rangeFlipIn .6s cubic-bezier(.2,.7,.2,1);
}

@keyframes rangeFlipIn{
  0%{transform:rotateX(-90deg);opacity:.15}
  65%{transform:rotateX(12deg);opacity:1}
  100%{transform:rotateX(0);opacity:1}
}

/* PÕHISISU */
.recent-wrap{
  max-width:var(--maxw);
  margin:12px auto 28px;
  padding:16px;
  background:rgba(255,255,255,.94);
  border:1px solid #000;
  border-radius:18px;
  box-shadow:0 4px 14px rgba(0,0,0,.09);
}

.recent-head{
  display:flex;
  justify-content:center;
  margin-bottom:14px;
}

.date-open-btn{
  width:min(360px,100%);
  min-height:52px;
  padding:11px 17px;
  border:1px solid #000;
  border-radius:13px;
  background:#fff;
  color:#000;
  font-family:'BebasKai',sans-serif;
  font-size:21px;
  letter-spacing:.4px;
  cursor:pointer;
  box-shadow:0 3px 10px rgba(0,0,0,.06);
  transition:transform .18s ease,background .18s ease;
}
.date-open-btn::after{
  content:"  ▾";
  font-family:system-ui,sans-serif;
}
.date-open-btn:hover{background:#f2f2f2;transform:translateY(-1px)}

#recentDay{
  border-top:1px solid rgba(0,0,0,.22);
  padding-top:14px;
}

#recentDay h4{
  margin:0;
  text-align:center;
  font-size:30px;
}

#recentDay .sub{
  margin:4px 0 13px;
  text-align:center;
  font-size:16px;
  opacity:.65;
}

.recent-grid{
  display:grid;
  gap:10px;
  grid-template-columns:repeat(auto-fill,minmax(170px,1fr));
}

.recent-card{
  display:block;
  background:#fff;
  border:1px solid #000;
  border-radius:13px;
  overflow:hidden;
  text-decoration:none;
  color:#000;
  box-shadow:0 3px 10px rgba(0,0,0,.07);
  transition:transform .18s ease,box-shadow .18s ease,background .18s ease;
}
.recent-card:hover{
  transform:translateY(-3px);
  box-shadow:0 6px 15px rgba(0,0,0,.12);
  background:#f5f5f5;
}

.recent-card .thumb{
  aspect-ratio:4/3;
  width:100%;
  object-fit:cover;
  display:block;
  background:#222;
}

.recent-card .meta{
  padding:8px 9px 9px;
  text-align:center;
  font-size:18px;
  line-height:1.08;
}

.recent-card .meta .brand{
  margin-top:4px;
  font-size:13px;
  opacity:.6;
}

#currentInfo{display:none}

/* MODAAL */
#dateModal{
  position:fixed;
  inset:0;
  z-index:2000;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:rgba(0,0,0,.58);
  backdrop-filter:blur(5px);
  -webkit-backdrop-filter:blur(5px);
}

#dateModal.open{
  display:flex;
  animation:fadeIn .18s ease;
}

@keyframes fadeIn{
  from{opacity:0}
  to{opacity:1}
}

.date-modal-card{
  width:min(500px,100%);
  max-height:82vh;
  padding:0;
  background:rgba(255,255,255,.99);
  border:1px solid #000;
  border-radius:18px;
  box-shadow:0 18px 50px rgba(0,0,0,.28);
  display:flex;
  flex-direction:column;
  overflow:hidden;
  animation:modalIn .22s ease;
}

@keyframes modalIn{
  from{transform:translateY(15px) scale(.985);opacity:.4}
  to{transform:none;opacity:1}
}

.date-modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  padding:14px 15px 11px;
  border-bottom:1px solid rgba(0,0,0,.25);
}

.date-modal-head h3{
  margin:0;
  font-size:28px;
}

.date-modal-close{
  width:38px;
  height:38px;
  border:1px solid #000;
  border-radius:50%;
  padding:0 0 3px;
  background:#fff;
  color:#000;
  font:26px/1 system-ui,sans-serif;
  cursor:pointer;
}
.date-modal-close:hover{background:#f2f2f2}

.date-list{
  list-style:none;
  margin:0;
  padding:12px;
  overflow-y:auto;
  display:flex;
  flex-direction:column;
  gap:7px;
  overscroll-behavior:contain;
}

.date-btn{
  width:100%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  padding:8px 13px;
  border:1px solid #000;
  border-radius:11px;
  background:#fff;
  color:#000;
  font-family:'BebasKai',sans-serif;
  font-size:19px;
  letter-spacing:.3px;
  cursor:pointer;
  text-align:left;
  -webkit-appearance:none;
  appearance:none;
}
.date-btn:hover{background:#f2f2f2}
.date-btn.active{background:#000;color:#fff}

.date-btn .d-label{
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.date-btn .d-count{
  flex:0 0 auto;
  font-size:14px;
  opacity:.75;
}

/* FOOTER */
footer{
  max-width:var(--maxw);
  margin:0 auto 35px;
  padding:0 16px;
  text-align:center;
  font-size:18px;
}

a,a:link,a:visited{color:#000}

/* MOBIIL */
@media(max-width:600px){
  body{background-attachment:scroll}

  .logo{
    width:92px;height:92px;top:10px;left:10px;border-radius:11px;
  }
  .logo.is-small{
    width:24px;height:24px;top:8px;left:8px;border-radius:5px;
  }

  header{padding:116px 12px 10px}

  h1{font-size:42px}

  .range-panel{
    margin-top:14px;
    padding:10px 10px 12px;
    border-radius:12px;
  }

  .range-controls{
    font-size:17px;
    gap:5px;
  }

  #recentRangeSelect{
    height:34px;
    min-width:55px;
    font-size:18px;
  }

  .range-flip-counter{
    min-height:50px;
    gap:4px;
    margin-top:10px;
  }

  .range-flip-digit{
    width:38px;
    height:49px;
    border-radius:7px;
  }

  .range-flip-digit .digit{
    font-size:38px;
  }

  .recent-wrap{
    margin:8px 8px 24px;
    padding:11px;
    border-radius:14px;
  }

  .date-open-btn{
    min-height:48px;
    font-size:19px;
  }

  #recentDay h4{font-size:26px}

  .recent-grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:7px;
  }

  .recent-card{
    border-radius:10px;
  }

  .recent-card .meta{
    padding:6px 7px 8px;
    font-size:16px;
  }

  .recent-card .meta .brand{
    font-size:12px;
  }

  #dateModal{
    padding:12px;
  }

  .date-modal-card{
    width:100%;
    max-height:86vh;
    border-radius:15px;
  }

  .date-modal-head h3{
    font-size:24px;
  }
}

</style>
</head>
<body>

<a href="index.html" class="logo" id="siteLogo" aria-label="Tagasi avalehele">
  <img src="img/logod/joelwheels.png" alt="Joelwheels">
</a>

  <!-- logo link avalehele -->
  

  <header>
  <a class="back" href="index.html">← AVALEHT</a>
  <h1>HILJUTI LISATUD</h1>

  <div class="range-panel">
    <div class="range-controls">
      <span>LISATUD VIIMASE</span>
      <select id="recentRangeSelect" aria-label="Päevade arv">
        <option value="7">7</option>
        <option value="14" selected>14</option>
        <option value="30">30</option>
        <option value="60">60</option>
        <option value="90">90</option>
      </select>
      <span>PÄEVA JOOKSUL</span>
    </div>

    <div class="range-flip-counter" id="recentRangeFlip" aria-label="Hiljuti lisatud mudelite arv">
      <div class="range-flip-digit"><span class="digit">0</span></div>
    </div>

    <span id="recentRangeCount" style="display:none">–</span>
  </div>
</header>

  <section class="recent-wrap">
    <div class="recent-head">
      <button type="button" class="date-open-btn" id="openDateModal">VALI KUUPÄEV</button>
    </div>

    <div id="recentDay" class="day-col">
      <h4 id="dayLabel"></h4>
      <p id="dayCount" class="sub"></p>
      <div class="recent-grid" id="dayGrid"></div>
    </div>

    <p class="current" id="currentInfo">Laen andmeid…</p>
  </section>

  <!-- KUUPÄEVA VALIKU MODAL -->
  <div id="dateModal" aria-hidden="true">
    <div class="date-modal-card">
      <div class="date-modal-head">
        <h3>Vali lisamiskuupäev</h3>
        <button type="button" class="date-modal-close" id="closeDateModal" aria-label="Sulge">×</button>
      </div>
      <ul class="date-list" id="dateList"></ul>
    </div>
  </div>

  <footer>© JOEL-MARK STOMMA <span id="year"></span></footer>
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>

  <script>
  // HILJUTI LISATUD – kuupäevamodal + päeva kaardid
  (function(){
    const dayTitle    = document.getElementById('dayLabel');
    const dayCount    = document.getElementById('dayCount');
    const dayGrid     = document.getElementById('dayGrid');
    const currentInfo = document.getElementById('currentInfo');
    const modal       = document.getElementById('dateModal');
    const dateListEl  = document.getElementById('dateList');
    const openBtn     = document.getElementById('openDateModal');
    const closeBtn    = document.getElementById('closeDateModal');

    if (!dayTitle || !dayCount || !dayGrid || !currentInfo || !modal || !dateListEl) return;

    let byDate    = {};   // { 'YYYY-MM-DD': [ items... ] }
    let dateKeys  = [];   // sorteeritud kuupäevad (uuem -> vanem)
    let currentKey = null;

    function formatDateLabel(key){
      if (/^\d{4}-\d{2}-\d{2}$/.test(key)){
        const d = new Date(key + 'T00:00:00');
        return d.toLocaleDateString('et-EE', {
          day:'2-digit', month:'2-digit', year:'numeric'
        });
      }
      return key;
    }

    function openModal(){
      modal.classList.add('open');
      modal.setAttribute('aria-hidden','false');
    }
    function closeModal(){
      modal.classList.remove('open');
      modal.setAttribute('aria-hidden','true');
    }

    function setActiveDate(key){
      dateListEl.querySelectorAll('.date-btn').forEach(btn=>{
        btn.classList.toggle('active', btn.dataset.date === key);
      });
    }

    function renderDay(key){
      const arr = byDate[key] || [];
      const label = formatDateLabel(key);

      if (!arr.length){
        dayTitle.textContent = label;
        dayCount.textContent = 'Sel päeval mudeleid lisatud ei ole.';
        dayGrid.innerHTML = '';
        currentInfo.textContent = `Näitan kuupäeva: ${label} — 0 mudelit`;
        setActiveDate(key);
        return;
      }

      currentInfo.textContent = `Näitan kuupäeva: ${label} — ${arr.length} mudelit`;
      dayTitle.textContent = label;
      dayCount.textContent = `${arr.length} mudelit lisatud sel päeval.`;

      const cardsHtml = arr.map(it => `
        <a class="recent-card" href="${it.url}">
          <img class="thumb" src="${it.img}" alt="${it.title}" loading="lazy" decoding="async">
          <div class="meta">
            <div class="title">${it.title}</div>
            <div class="brand">${it.brand}</div>
          </div>
        </a>
      `).join('');

      dayGrid.innerHTML = cardsHtml;
      setActiveDate(key);
    }

    function renderDateModal(){
      if (!dateKeys.length){
        dateListEl.innerHTML = '<li style="opacity:.7;">Hiljuti lisatud mudeleid ei leitud.</li>';
        currentInfo.textContent = 'Ei leitud hiljuti lisatud mudeleid.';
        return;
      }

      dateListEl.innerHTML = dateKeys.map(key => {
        const arr = byDate[key] || [];
        return `
          <li>
            <button type="button"
                    class="date-btn${key===currentKey?' active':''}"
                    data-date="${key}">
              <span class="d-label">${formatDateLabel(key)}</span>
              <span class="d-count">${arr.length} mudelit</span>
            </button>
          </li>
        `;
      }).join('');
    }

    async function loadAll(){
      if (location.protocol === 'file:'){
        dayTitle.textContent = '';
        dayCount.textContent = '';
        dayGrid.innerHTML = '<p style="opacity:.7;">Ava see leht serveris (GitHub Pages vms).</p>';
        currentInfo.textContent = '–';
        return;
      }

      currentInfo.textContent = 'Laen andmeid…';

      let html = '';
      try{
        const r = await fetch('mudelid.html', { cache:'no-store' });
        if (!r.ok) throw 0;
        html = await r.text();
      }catch{
        dayTitle.textContent = '';
        dayCount.textContent = '';
        dayGrid.innerHTML = '<p style="opacity:.7;">Ei saanud mudelid.html lugeda.</p>';
        currentInfo.textContent = 'Viga andmete laadimisel.';
        return;
      }

      const doc  = new DOMParser().parseFromString(html,'text/html');
      const base = new URL(location.href);
      const brands = [...doc.querySelectorAll('.brand-card[href]')].map(a=>({
        href : new URL(a.getAttribute('href'), base).href,
        name : (a.querySelector('.brand-name')?.textContent || '').trim()
      }));

      await Promise.all(brands.map(async ({href,name})=>{
        try{
          const r = await fetch(href,{cache:'no-store'});
          if(!r.ok) return;
          const h = await r.text();
          const d = new DOMParser().parseFromString(h,'text/html');
          const brand = d.querySelector('meta[name="brand"]')?.content?.trim() || name;

          d.querySelectorAll('.card[data-added]').forEach(c=>{
            const title = (c.querySelector('.title')?.textContent || '').trim();
            const img   = c.querySelector('.thumb')?.getAttribute('src') || '';
            const raw   = c.getAttribute('data-added') || '';
            const ts    = Date.parse(raw);
            if(!title || !img || isNaN(ts)) return;

            const dateObj = new Date(ts);
            const key = dateObj.toISOString().slice(0,10); // YYYY-MM-DD

            const full  = new URL(img, href).href;
            const u     = new URL(href, base);

            let imageFile = '';
            try{
              imageFile = decodeURIComponent(new URL(full).pathname.split('/').pop() || '');
            }catch{
              imageFile = (img || '').split('/').pop().split('?')[0];
            }

            if (imageFile){
              u.searchParams.set('img', imageFile);
            } else {
              // Fallback juhuks, kui pildi failinime ei ole võimalik tuvastada
              u.searchParams.set('m', title);
            }

            u.searchParams.set('from', 'recent');

            (byDate[key] ||= []).push({
              brand,
              title,
              img: full,
              url: u.pathname + u.search,
              ts
            });
          });
        }catch{
          // vaikne ignore
        }
      }));

      if (!Object.keys(byDate).length){
        dayTitle.textContent = '';
        dayCount.textContent = '';
        dayGrid.innerHTML = '<p style="opacity:.7;">Hiljuti lisatud mudeleid ei leitud.</p>';
        currentInfo.textContent = 'Ei leitud hiljuti lisatud mudeleid.';
        return;
      }

// sorteerime igas kuupäevas mudelid aja järgi (uuem enne)
Object.keys(byDate).forEach(k => {
  byDate[k].sort((a,b) => b.ts - a.ts);
});

// sorteerime kuupäevad uuem -> vanem
dateKeys = Object.keys(byDate).sort((a,b) => b.localeCompare(a));

currentKey = dateKeys[0]; // vaikimisi uusim päev

// --- MUUDETAVA AJAGA COUNTER – INIT + LISTENER ---
const sel = document.getElementById('recentRangeSelect');
if(sel){
  const days = parseInt(sel.value,10) || 14;
  updateRangeCounter(days);  // ← siit kaob 0 ja tuleb kohe õige number

  sel.addEventListener('change', () => {
    const d = parseInt(sel.value,10) || 14;
    updateRangeCounter(d);
  });
}

renderDateModal();
renderDay(currentKey);
    }

    // modal nupud
    if (openBtn){
      openBtn.addEventListener('click', openModal);
    }
    if (closeBtn){
      closeBtn.addEventListener('click', closeModal);
    }
    modal.addEventListener('click', e=>{
      if (e.target === modal) closeModal();
    });
    window.addEventListener('keydown', e=>{
      if (e.key === 'Escape' && modal.classList.contains('open')){
        closeModal();
      }
    });

// --- Viimase 14 päeva loendur ---
const targetDays = 14;
const now = Date.now();
const cutoff = now - targetDays*24*60*60*1000;

let count14 = 0;
Object.values(byDate).forEach(list=>{
  list.forEach(item=>{
    if(item.ts >= cutoff) count14++;
  });
});

const infoEl = document.getElementById('recent14Info');
if(infoEl){
  infoEl.textContent = `Lisatud viimase ${targetDays} päeva jooksul: ${count14}`;
}

    // kuupäeva valik
    dateListEl.addEventListener('click', e=>{
      const btn = e.target.closest('.date-btn');
      if (!btn) return;
      const key = btn.dataset.date;
      if (!key) return;
      currentKey = key;
      renderDay(key);
      closeModal();
    });

// --- Muudetava ajaga flip-counter ---
function renderRangeFlipCounter(number){
  const counter = document.getElementById('recentRangeFlip');
  if(!counter) return;

  const digits = String(number ?? 0).split('');

  counter.innerHTML = digits.map(d => `
    <div class="range-flip-digit">
      <span class="digit">${d}</span>
    </div>
  `).join('');

  requestAnimationFrame(() => {
    counter.querySelectorAll('.range-flip-digit').forEach((el, i) => {
      setTimeout(() => el.classList.add('animate'), i * 80);
    });
  });

  counter.setAttribute('aria-label', `${number ?? 0} hiljuti lisatud mudelit`);
}

// --- Muudetava ajaga counter ---
function updateRangeCounter(days){
  const now = Date.now();
  const cutoff = now - days * 24*60*60*1000;
  let total = 0;
  Object.values(byDate).forEach(list=>{
    list.forEach(item=>{
      if(item.ts >= cutoff) total++;
    });
  });
  const span = document.getElementById('recentRangeCount');
  if(span) span.textContent = total;

  renderRangeFlipCounter(total);
}

// esmane render (vaikimisi 14 päeva)
updateRangeCounter(14);

// muutmine selectist
const sel = document.getElementById('recentRangeSelect');
if(sel){
  sel.addEventListener('change',()=>{
    updateRangeCounter(parseInt(sel.value,10));
  });
}

    loadAll();
  })();
  </script>


<script>
(() => {
  const logo = document.getElementById('siteLogo');
  const modal = document.getElementById('dateModal');

  function updateLogo(){
    logo?.classList.toggle('is-small', window.scrollY > 70);
  }

  updateLogo();
  window.addEventListener('scroll', updateLogo, {passive:true});

  if (modal){
    const observer = new MutationObserver(() => {
      document.body.classList.toggle('modal-open', modal.classList.contains('open'));
    });
    observer.observe(modal, {attributes:true, attributeFilter:['class']});
  }
})();
</script>

</body>
