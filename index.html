<!doctype html>
<html lang="et">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>JOELI KOLLEKTSIOON</title>

  <style>
    @font-face {
      font-family: 'BebasKai';
      src: url('fonts/bebaskai.woff2') format('woff2'),
           url('fonts/bebaskai.woff') format('woff');
      font-weight: normal;
      font-style: normal;
    }

    :root{
      --bg:#fff;
      --text:#000;
      --border:#000;
      --maxw:500px;
      --radius:14px;
    }

    *{ box-sizing:border-box; }

    html{
      min-height:100%;
      scroll-behavior:smooth;
    }

    body{
      margin:0;
      min-height:100%;
      background:url("img/taust3.jpg?v=2") no-repeat center center fixed;
      background-size:cover;
      color:var(--text);
      font-family:'BebasKai',sans-serif;
    }

    body.modal-open{
      overflow:hidden;
    }

    /* =========================
       LOGO
       ========================= */

    .logo{
      position:fixed;
      top:18px;
      left:18px;
      z-index:900;
      width:100px;
      height:100px;
      display:block;
      border:1px solid var(--border);
      border-radius:14px;
      overflow:hidden;
      background:#fff;
      box-shadow:0 5px 18px rgba(0,0,0,.14);
      transition:
        width .28s ease,
        height .28s ease,
        top .28s ease,
        right .28s ease,
        border-radius .28s ease,
        box-shadow .28s ease;
    }

    .logo img{
      width:100%;
      height:100%;
      display:block;
      object-fit:cover;
    }

    .logo.is-small{
      width:30px;
      height:30px;
      top:10px;
      left:10px;
      border-radius:7px;
      box-shadow:0 3px 10px rgba(0,0,0,.18);
    }

    /* =========================
       ÜLAOSA
       ========================= */

    header{
      max-width:var(--maxw);
      margin:0 auto;
      padding:42px 16px 8px;
      text-align:center;
    }

    h1{
      margin:0;
      font-size:64px;
      line-height:.98;
      letter-spacing:.5px;
    }

    .count-label{
      margin:18px 0 8px;
      font-size:24px;
      line-height:1;
    }

    /* =========================
       FLIP-LOENDUR
       ========================= */

    .flip-counter{
      display:flex;
      justify-content:center;
      gap:7px;
      margin:8px auto 20px;
      min-height:72px;
    }

    .flip-digit{
      position:relative;
      width:54px;
      height:70px;
      border:1px solid #000;
      border-radius:9px;
      background:#fff;
      box-shadow:0 4px 10px rgba(0,0,0,.12);
      overflow:hidden;
      perspective:400px;
    }

    .flip-digit::after{
      content:"";
      position:absolute;
      left:0;
      right:0;
      top:50%;
      height:1px;
      background:#000;
      opacity:.65;
      z-index:3;
      pointer-events:none;
    }

    .flip-digit .digit{
      position:absolute;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:54px;
      line-height:1;
      padding-top:4px;
      backface-visibility:hidden;
      transform-origin:center bottom;
    }

    .flip-digit.animate .digit{
      animation:flipIn .6s cubic-bezier(.2,.7,.2,1);
    }

    @keyframes flipIn{
      0%{
        transform:rotateX(-90deg);
        opacity:.15;
      }
      65%{
        transform:rotateX(12deg);
        opacity:1;
      }
      100%{
        transform:rotateX(0);
        opacity:1;
      }
    }

    /* =========================
       NUPUD
       ========================= */

    .home-actions{
      max-width:500px;
      margin:0 auto 34px;
      padding:0 16px;
    }

    .small-actions{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
      margin-bottom:12px;
    }

    .action-btn{
      width:100%;
      min-height:58px;
      border:1px solid var(--border);
      border-radius:var(--radius);
      background:#fff;
      color:#000;
      font-family:'BebasKai',sans-serif;
      font-size:25px;
      letter-spacing:.4px;
      text-decoration:none;
      cursor:pointer;
      padding:13px 16px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:14px;
      transition:transform .18s ease, background .18s ease, box-shadow .18s ease;
      box-shadow:0 3px 10px rgba(0,0,0,.07);
      text-align:left;
      -webkit-appearance:none;
      appearance:none;
    }

    .small-actions .action-btn{
      font-size:20px;
      padding:12px 13px;
    }

    .action-btn:hover{
      background:#f2f2f2;
      transform:translateY(-2px);
      box-shadow:0 5px 14px rgba(0,0,0,.10);
    }

    .action-btn:active{
      transform:translateY(0);
    }

    .action-btn:focus-visible{
      outline:3px solid #000;
      outline-offset:3px;
    }

    .action-icon{
      flex:0 0 auto;
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      font-size:24px;
      line-height:1;
      font-weight:700;
    }

    .small-actions .action-icon{
      font-size:21px;
    }

    .big-actions{
      display:grid;
      gap:12px;
    }

    /* =========================
       MODAAL
       ========================= */

    .modal-backdrop{
      position:fixed;
      inset:0;
      z-index:2000;
      display:none;
      align-items:center;
      justify-content:center;
      padding:20px;
      background:rgba(0,0,0,.58);
      backdrop-filter:blur(5px);
      -webkit-backdrop-filter:blur(5px);
    }

    .modal-backdrop.open{
      display:flex;
      animation:fadeIn .18s ease;
    }

    @keyframes fadeIn{
      from{ opacity:0; }
      to{ opacity:1; }
    }

    .modal{
      width:min(560px, 100%);
      max-height:min(82vh, 760px);
      background:rgba(255,255,255,.98);
      border:1px solid #000;
      border-radius:18px;
      box-shadow:0 18px 50px rgba(0,0,0,.28);
      display:flex;
      flex-direction:column;
      overflow:hidden;
      animation:modalIn .22s ease;
    }

    @keyframes modalIn{
      from{
        transform:translateY(15px) scale(.985);
        opacity:.4;
      }
      to{
        transform:translateY(0) scale(1);
        opacity:1;
      }
    }

    .modal-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding:14px 16px 10px;
      border-bottom:1px solid rgba(0,0,0,.25);
    }

    .modal-head h2{
      margin:0;
      font-size:30px;
      line-height:1;
    }

    .modal-close{
      width:38px;
      height:38px;
      border:1px solid #000;
      border-radius:50%;
      background:#fff;
      color:#000;
      font:26px/1 system-ui,sans-serif;
      cursor:pointer;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:0 0 3px;
    }

    .modal-close:hover{
      background:#f2f2f2;
    }

    .modal-body{
      overflow-y:auto;
      padding:14px;
      overscroll-behavior:contain;
    }

    /* =========================
       PÄEVA MUDELID MODAALIS
       ========================= */

    .daily-grid{
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    .daily-card{
      display:flex;
      gap:12px;
      align-items:center;
      text-decoration:none;
      color:#000;
      background:#fff;
      border:1px solid #000;
      border-radius:12px;
      padding:7px 9px;
      transition:transform .15s ease, background .15s ease;
    }

    .daily-card:hover{
      background:#f5f5f5;
      transform:translateY(-1px);
    }

    .daily-card .thumb{
      width:125px;
      aspect-ratio:4 / 3;
      object-fit:cover;
      border-radius:8px;
      flex-shrink:0;
      display:block;
    }

    .daily-card .meta{
      min-width:0;
      flex:1;
    }

    .daily-card .title{
      font-size:21px;
      line-height:1.05;
    }

    .daily-card .brand{
      margin-top:5px;
      font-size:15px;
      opacity:.65;
    }

    /* =========================
       EDETABEL MODAALIS
       ========================= */

    .ranking-list{
      list-style:none;
      margin:0;
      padding:0;
    }

    .ranking-list li{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      border-bottom:1px solid rgba(0,0,0,.24);
      padding:8px 2px;
    }

    .ranking-list li:last-child{
      border-bottom:0;
    }

    .ranking-list .names{
      min-width:0;
      flex:1;
    }

    .ranking-list a{
      color:#000;
      text-decoration:none;
      font-size:23px;
      line-height:1.1;
    }

    .ranking-list a:hover{
      text-decoration:underline;
    }

    .ranking-list .count{
      font-size:18px;
      opacity:.65;
      flex:0 0 auto;
    }

    .ranking-more-row{
      display:flex !important;
      justify-content:center !important;
      border-bottom:0 !important;
      padding-top:15px !important;
    }

    .ranking-more-btn{
      border:1px solid #000;
      border-radius:999px;
      background:#fff;
      color:#000;
      font-family:'BebasKai',sans-serif;
      font-size:18px;
      padding:7px 15px;
      cursor:pointer;
      -webkit-appearance:none;
      appearance:none;
    }

    .ranking-more-btn:hover{
      background:#f2f2f2;
    }

    .loading,
    .error{
      font-size:20px;
      text-align:center;
      padding:20px 8px;
      opacity:.7;
    }

    /* =========================
       OTSING / ÜLLATA MIND
       ========================= */

    .modal-tools{
      display:flex;
      gap:9px;
      margin:0 0 12px;
    }

    .modal-tool-btn{
      width:100%;
      min-height:44px;
      border:1px solid #000;
      border-radius:11px;
      background:#fff;
      color:#000;
      font-family:'BebasKai',sans-serif;
      font-size:18px;
      letter-spacing:.3px;
      cursor:pointer;
      padding:9px 12px;
      transition:background .15s ease, transform .15s ease;
      -webkit-appearance:none;
      appearance:none;
    }

    .modal-tool-btn:hover{
      background:#f2f2f2;
      transform:translateY(-1px);
    }

    .search-field{
      position:relative;
      margin-bottom:12px;
    }

    .search-field input{
      width:100%;
      height:50px;
      padding:9px 48px 9px 14px;
      border:1px solid #000;
      border-radius:12px;
      background:#fff;
      color:#000;
      font-family:'BebasKai',sans-serif;
      font-size:21px;
      letter-spacing:.4px;
      outline:none;
      -webkit-appearance:none;
      appearance:none;
    }

    .search-field input:focus{
      box-shadow:0 0 0 3px rgba(0,0,0,.12);
    }

    .search-field::after{
      content:"⌕";
      position:absolute;
      right:14px;
      top:50%;
      transform:translateY(-54%);
      font:26px/1 system-ui,-apple-system,sans-serif;
      pointer-events:none;
    }

    .search-results{
      display:flex;
      flex-direction:column;
      gap:8px;
    }

    .search-result{
      display:flex;
      align-items:center;
      gap:10px;
      padding:7px 9px;
      border:1px solid #000;
      border-radius:11px;
      background:#fff;
      color:#000;
      text-decoration:none;
      transition:background .15s ease, transform .15s ease;
    }

    .search-result:hover{
      background:#f5f5f5;
      transform:translateY(-1px);
    }

    .search-result img{
      width:96px;
      aspect-ratio:4/3;
      object-fit:cover;
      border-radius:7px;
      flex:0 0 auto;
    }

    .search-result .r-meta{
      min-width:0;
      flex:1;
    }

    .search-result .r-title{
      font-size:19px;
      line-height:1.05;
    }

    .search-result .r-brand{
      margin-top:4px;
      font-size:14px;
      opacity:.62;
    }

    .search-summary{
      margin:0 0 10px;
      font-size:15px;
      opacity:.65;
      text-align:center;
    }

    .surprise-card{
      overflow:hidden;
      border:1px solid #000;
      border-radius:14px;
      background:#fff;
      box-shadow:0 3px 10px rgba(0,0,0,.07);
    }

    .surprise-card img{
      display:block;
      width:100%;
      aspect-ratio:4/3;
      object-fit:cover;
      background:#222;
    }

    .surprise-meta{
      padding:12px 14px 14px;
      text-align:center;
    }

    .surprise-title{
      font-size:28px;
      line-height:1.02;
    }

    .surprise-brand{
      margin-top:5px;
      font-size:17px;
      opacity:.62;
    }

    .surprise-actions{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:9px;
      margin-top:13px;
    }

    .surprise-link{
      display:flex;
      align-items:center;
      justify-content:center;
      min-height:44px;
      padding:9px 12px;
      border:1px solid #000;
      border-radius:11px;
      background:#000;
      color:#fff;
      text-decoration:none;
      font-size:18px;
      letter-spacing:.3px;
    }

    .surprise-link:hover{
      opacity:.82;
    }

    /* =========================
       FOOTER
       ========================= */

    footer{
      max-width:500px;
      margin:0 auto 32px;
      padding:0 16px;
      text-align:center;
      font-size:18px;
    }

    /* =========================
       MOBIIL
       ========================= */

    @media (max-width:600px){
      body{
        background-attachment:scroll;
      }

      .logo{
        width:74px;
        height:74px;
        top:10px;
        left:10px;
        border-radius:11px;
      }

      .logo.is-small{
        width:24px;
        height:24px;
        top:8px;
        left:8px;
        border-radius:5px;
      }

      header{
        padding-top:118px;
      }

      h1{
        font-size:44px;
      }

      .count-label{
        font-size:20px;
        margin-top:15px;
      }

      .flip-counter{
        min-height:61px;
        gap:5px;
        margin-bottom:16px;
      }

      .flip-digit{
        width:45px;
        height:59px;
        border-radius:8px;
      }

      .flip-digit .digit{
        font-size:45px;
      }

      .home-actions{
        padding:0 12px;
      }

      .small-actions{
        gap:8px;
      }

      .small-actions .action-btn{
        min-height:54px;
        font-size:17px;
        padding:10px;
      }

      .small-actions .action-icon{
        font-size:18px;
      }

      .action-btn{
        min-height:54px;
        font-size:22px;
        padding:12px 14px;
        border-radius:11px;
      }

      .action-icon{
        font-size:21px;
      }

      .modal-backdrop{
        padding:12px;
        align-items:center;
      }

      .modal{
        width:100%;
        max-height:86vh;
        border-radius:15px;
      }

      .modal-head h2{
        font-size:26px;
      }

      .modal-body{
        padding:10px;
      }

      .daily-card{
        gap:9px;
        padding:6px 7px;
      }

      .daily-card .thumb{
        width:100px;
      }

      .daily-card .title{
        font-size:17px;
      }

      .daily-card .brand{
        font-size:13px;
      }

      .ranking-list a{
        font-size:20px;
      }

      .ranking-list .count{
        font-size:16px;
      }

      .search-result img{
        width:82px;
      }

      .search-result .r-title{
        font-size:17px;
      }

      .surprise-title{
        font-size:23px;
      }

      .surprise-actions{
        grid-template-columns:1fr;
      }
    }
  </style>
</head>

<body>

  <!-- LOGO -->
  <a href="index.html" class="logo" id="siteLogo" aria-label="Tagasi avalehele">
    <img src="img/logod/joelwheels.png" alt="Joelwheels">
  </a>

  <!-- PÄIS + LOENDUR -->
  <header>
    <h1>JOELI MUDELIKOLLEKTSIOON</h1>
    <div class="count-label">KOKKU ERINEVAID MUDELEID</div>
    <div class="flip-counter" id="flipCounter" aria-label="Mudelite koguarv">
      <div class="flip-digit"><span class="digit">0</span></div>
    </div>
  </header>

  <!-- PÕHINUPUD -->
  <main class="home-actions">

    <div class="small-actions">
      <button type="button" class="action-btn" id="btnDaily">
        <span>PÄEVA MUDELID</span>
        <span class="action-icon" aria-hidden="true">✦</span>
      </button>

      <button type="button" class="action-btn" id="btnRanking">
        <span>EDETABEL</span>
        <span class="action-icon" aria-hidden="true">♛</span>
      </button>
    </div>

    <div class="big-actions">
      <a href="hiljutised.html" class="action-btn">
        <span>HILJUTI LISATUD</span>
        <span class="action-icon" aria-hidden="true">＋</span>
      </a>

      <a href="mudelid.html" class="action-btn">
        <span>KÕIK MUDELID</span>
        <span class="action-icon" aria-hidden="true">▦</span>
      </a>

      <button type="button" class="action-btn" id="btnSearch">
        <span>OTSI MUDELIT</span>
        <span class="action-icon" aria-hidden="true">⌕</span>
      </button>

      <button type="button" class="action-btn" id="btnRandomBrand">
        <span>SUVALINE TOOTJA</span>
        <span class="action-icon" aria-hidden="true">↻</span>
      </button>

      <button type="button" class="action-btn" id="btnSurprise">
        <span>ÜLLATA MIND</span>
        <span class="action-icon" aria-hidden="true">◆</span>
      </button>
    </div>

  </main>

  <footer>© JOEL-MARK STOMMA <span id="year"></span></footer>


  <!-- PÄEVA MUDELID MODAAL -->
  <div class="modal-backdrop" id="dailyModal" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="dailyTitle">
      <div class="modal-head">
        <h2 id="dailyTitle">PÄEVA MUDELID</h2>
        <button class="modal-close" type="button" data-close-modal aria-label="Sulge">×</button>
      </div>
      <div class="modal-body">
        <div class="daily-grid" id="dailyGrid">
          <div class="loading">LAEN…</div>
        </div>

        <div class="modal-tools" style="margin-top:12px;margin-bottom:0;">
          <button type="button" class="modal-tool-btn" id="btnDailyRefresh">🎲 ANNA 3 UUT</button>
        </div>
      </div>
    </div>
  </div>


  <!-- EDETABELI MODAAL -->
  <div class="modal-backdrop" id="rankingModal" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="rankingTitle">
      <div class="modal-head">
        <h2 id="rankingTitle">EDETABEL</h2>
        <button class="modal-close" type="button" data-close-modal aria-label="Sulge">×</button>
      </div>
      <div class="modal-body">
        <ol class="ranking-list" id="rankingList">
          <li><span class="loading">LAEN…</span></li>
        </ol>
      </div>
    </div>
  </div>



  <!-- OTSINGU MODAAL -->
  <div class="modal-backdrop" id="searchModal" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="searchTitle">
      <div class="modal-head">
        <h2 id="searchTitle">OTSI MUDELIT</h2>
        <button class="modal-close" type="button" data-close-modal aria-label="Sulge">×</button>
      </div>
      <div class="modal-body">
        <div class="search-field">
          <input id="collectionSearch" type="search" placeholder="KIRJUTA MUDELI VÕI TOOTJA NIMI" autocomplete="off">
        </div>
        <div class="search-summary" id="searchSummary">ALUSTA KIRJUTAMIST</div>
        <div class="search-results" id="searchResults"></div>
      </div>
    </div>
  </div>

  <!-- ÜLLATA MIND MODAAL -->
  <div class="modal-backdrop" id="surpriseModal" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="surpriseTitle">
      <div class="modal-head">
        <h2 id="surpriseTitle">ÜLLATA MIND</h2>
        <button class="modal-close" type="button" data-close-modal aria-label="Sulge">×</button>
      </div>
      <div class="modal-body" id="surpriseBody">
        <div class="loading">LAEN…</div>
      </div>
    </div>
  </div>


  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    /* =========================
       LOGO VÄHENEB SCROLLIDES
       ========================= */
    (() => {
      const logo = document.getElementById('siteLogo');
      if (!logo) return;

      function updateLogo(){
        logo.classList.toggle('is-small', window.scrollY > 70);
      }

      updateLogo();
      window.addEventListener('scroll', updateLogo, { passive:true });
    })();


    /* =========================
       MODAALID
       ========================= */
    (() => {
      const dailyModal    = document.getElementById('dailyModal');
      const rankingModal  = document.getElementById('rankingModal');
      const searchModal   = document.getElementById('searchModal');
      const surpriseModal = document.getElementById('surpriseModal');

      const btnDaily    = document.getElementById('btnDaily');
      const btnRanking  = document.getElementById('btnRanking');
      const btnSearch   = document.getElementById('btnSearch');
      const btnSurprise = document.getElementById('btnSurprise');

      let lastFocused = null;

      function openModal(modal){
        if (!modal) return;
        lastFocused = document.activeElement;
        modal.classList.add('open');
        modal.setAttribute('aria-hidden','false');
        document.body.classList.add('modal-open');

        const close = modal.querySelector('.modal-close');
        setTimeout(() => close?.focus(), 30);
      }

      function closeModal(modal){
        if (!modal) return;
        modal.classList.remove('open');
        modal.setAttribute('aria-hidden','true');
        document.body.classList.remove('modal-open');

        if (modal === dailyModal && location.hash === '#daily'){
          history.replaceState({}, '', location.pathname + location.search);
        }

        lastFocused?.focus?.();
      }

      btnDaily?.addEventListener('click', () => openModal(dailyModal));
      btnRanking?.addEventListener('click', () => openModal(rankingModal));
      btnSearch?.addEventListener('click', () => {
        openModal(searchModal);
        setTimeout(() => document.getElementById('collectionSearch')?.focus(), 40);
      });
      btnSurprise?.addEventListener('click', () => openModal(surpriseModal));

      window.AppModals = {
        openModal,
        closeModal,
        dailyModal,
        rankingModal,
        searchModal,
        surpriseModal
      };

      document.querySelectorAll('[data-close-modal]').forEach(btn => {
        btn.addEventListener('click', () => closeModal(btn.closest('.modal-backdrop')));
      });

      document.querySelectorAll('.modal-backdrop').forEach(backdrop => {
        backdrop.addEventListener('click', e => {
          if (e.target === backdrop) closeModal(backdrop);
        });
      });

      document.addEventListener('keydown', e => {
        if (e.key !== 'Escape') return;
        const open = document.querySelector('.modal-backdrop.open');
        if (open) closeModal(open);
      });

      // Kui mudeli lightboxist tullakse tagasi Päeva mudelitesse,
      // avaneb Päeva mudelite modaal automaatselt.
      if (location.hash === '#daily'){
        setTimeout(() => openModal(dailyModal), 0);
      }
    })();


    /* =========================
       ÜHINE ANDMETE LAADIMINE
       ========================= */

    const CollectionData = (() => {
      let loadingPromise = null;

      function imageFileName(imgUrl){
        try{
          const u = new URL(imgUrl, location.href);
          return decodeURIComponent(u.pathname.split('/').pop() || '');
        }catch{
          return (imgUrl || '').split('/').pop().split('?')[0];
        }
      }

      function makeModelUrl(brandPageHref, title, imgUrl, base){
        const url = new URL(brandPageHref, base);

        const file = imageFileName(imgUrl);
        if (file){
          url.searchParams.set('img', file);
        } else {
          // Fallback vanemate / ilma pildita kaartide jaoks
          url.searchParams.set('m', title);
        }

        return url.pathname + url.search;
      }

      async function load(){
        if (loadingPromise) return loadingPromise;

        loadingPromise = (async () => {
          if (location.protocol === 'file:'){
            throw new Error('file');
          }

          const base = new URL(location.href);

          const r = await fetch('mudelid.html', { cache:'no-store' });
          if (!r.ok) throw new Error('mudelid');

          const html = await r.text();
          const doc  = new DOMParser().parseFromString(html,'text/html');

          const brandCards = [...doc.querySelectorAll('.brand-card[href]')];

          const brandLinks = brandCards.map(card => ({
            href: new URL(card.getAttribute('href'), base).href,
            name: (card.querySelector('.brand-name')?.textContent || '').trim()
          })).filter(x => x.href);

          const brands = [];
          const models = [];

          await Promise.all(brandLinks.map(async brand => {
            try{
              const rr = await fetch(brand.href, { cache:'no-store' });
              if (!rr.ok) return;

              const h = await rr.text();
              const d = new DOMParser().parseFromString(h,'text/html');

              const brandName =
                d.querySelector('meta[name="brand"]')?.content?.trim()
                || brand.name;

              const cards = [...d.querySelectorAll('.card')];

              let modelCount = cards.length;

              if (!modelCount){
                const metaCount = d.querySelector('meta[name="models-count"]');
                modelCount = parseInt(metaCount?.content || '0', 10) || 0;
              }

              if (modelCount){
                brands.push({
                  name: brandName,
                  href: new URL(brand.href).pathname,
                  count: modelCount
                });
              }

              cards.forEach(card => {
                const title =
                  (card.querySelector('.title')?.textContent
                  || card.querySelector('h3')?.textContent
                  || '').trim();

                const img = card.querySelector('.thumb')?.getAttribute('src') || '';

                if (!title) return;

                models.push({
                  brand: brandName,
                  title,
                  img: img ? new URL(img, brand.href).href : '',
                  url: makeModelUrl(brand.href, title, img, base)
                });
              });

            }catch(e){
              console.warn('Tootjalehe laadimine ebaõnnestus:', brand.href, e);
            }
          }));

          brands.sort((a,b) =>
            (b.count - a.count) || a.name.localeCompare(b.name)
          );

          models.sort((a,b) =>
            (a.brand + ' ' + a.title).localeCompare(b.brand + ' ' + b.title)
          );

          const total = brands.reduce((sum, x) => sum + x.count, 0);

          return { brands, models, total };
        })();

        return loadingPromise;
      }

      return { load };
    })();


    /* =========================
       FLIP-LOENDUR
       ========================= */

    function renderFlipCounter(number){
      const counter = document.getElementById('flipCounter');
      if (!counter) return;

      const digits = String(number || 0).split('');

      counter.innerHTML = digits.map((d, i) => `
        <div class="flip-digit" style="animation-delay:${i * 80}ms">
          <span class="digit">${d}</span>
        </div>
      `).join('');

      requestAnimationFrame(() => {
        [...counter.querySelectorAll('.flip-digit')].forEach((el, i) => {
          setTimeout(() => el.classList.add('animate'), i * 80);
        });
      });

      counter.setAttribute(
        'aria-label',
        `Kokku ${number || 0} erinevat mudelit`
      );
    }


    /* =========================
       PÄEVA MUDELID
       ========================= */

    function renderDailyCards(items){
      const grid = document.getElementById('dailyGrid');
      if (!grid) return;

      if (!items.length){
        grid.innerHTML = '<div class="error">ÜHTEGI MUDELIT EI LEITUD.</div>';
        return;
      }

      grid.innerHTML = items.map(it => {
        const dailyUrl = new URL(it.url, location.href);
        dailyUrl.searchParams.set('from', 'daily');

        return `
          <a class="daily-card" href="${dailyUrl.pathname + dailyUrl.search}">
            ${
              it.img
                ? `<img class="thumb" src="${it.img}" alt="${escapeHtml(it.title)}" loading="lazy" decoding="async">`
                : ''
            }
            <div class="meta">
              <div class="title">${escapeHtml(it.title)}</div>
              <div class="brand">${escapeHtml(it.brand)}</div>
            </div>
          </a>
        `;
      }).join('');
    }

    function pickDailyModels(models){
      const today = new Date();
      const dayOfYear = Math.floor(
        (today - new Date(today.getFullYear(), 0, 0)) / 86400000
      );

      const picked = [];
      const used = new Set();
      const len = models.length;

      for (let k = 0; k < 3 && picked.length < 3 && k < len * 2; k++){
        const idx = (dayOfYear * 7 + k * 97) % len;
        const it = models[idx];
        const key = it.brand + '|' + it.title + '|' + it.img;
        if (used.has(key)) continue;
        used.add(key);
        picked.push(it);
      }

      return picked;
    }

    function pickRandomModels(models, count = 3){
      const pool = [...models];
      const picked = [];

      while (pool.length && picked.length < count){
        const index = Math.floor(Math.random() * pool.length);
        picked.push(pool.splice(index, 1)[0]);
      }

      return picked;
    }

    function renderDaily(models){
      renderDailyCards(pickDailyModels(models));
    }


    /* =========================
       EDETABEL
       ========================= */

    function renderRanking(brands){
      const list = document.getElementById('rankingList');
      if (!list) return;

      if (!brands.length){
        list.innerHTML = '<li><span class="error">ANDMEID EI LEITUD.</span></li>';
        return;
      }

      const LIMIT = 10;
      let expanded = false;

      function draw(){
        const visible = expanded ? brands : brands.slice(0, LIMIT);

        list.innerHTML = visible.map((x, idx) => `
          <li>
            <span class="names">
              <a href="${x.href}">${idx + 1}. ${escapeHtml(x.name)}</a>
            </span>
            <span class="count">${x.count}</span>
          </li>
        `).join('');

        if (!expanded && brands.length > LIMIT){
          const li = document.createElement('li');
          li.className = 'ranking-more-row';
          li.innerHTML = `
            <button type="button" class="ranking-more-btn" id="showAllBrands">
              VAATA KÕIKI (${brands.length})
            </button>
          `;
          list.appendChild(li);

          li.querySelector('#showAllBrands').addEventListener('click', () => {
            expanded = true;
            draw();
          });
        }
      }

      draw();
    }


    /* =========================
       RANDOM NUPUD
       ========================= */

    function pick(arr){
      return arr[Math.floor(Math.random() * arr.length)];
    }

    document.getElementById('btnRandomBrand')?.addEventListener('click', async () => {
      try{
        const data = await CollectionData.load();

        if (!data.brands.length) throw new Error('no-brands');

        const brand = pick(data.brands);
        location.href = brand.href;

      }catch(e){
        if (e?.message === 'file'){
          alert('Ava leht serveris (GitHub Pages).');
        } else {
          alert('Ei saanud tootjate nimekirja laadida.');
        }
      }
    });

    function modelViewUrl(it, from = ''){
      const u = new URL(it.url, location.href);
      if (from) u.searchParams.set('from', from);
      return u.pathname + u.search;
    }

    function renderSurpriseModel(model){
      const body = document.getElementById('surpriseBody');
      if (!body) return;

      body.innerHTML = `
        <div class="surprise-card">
          ${
            model.img
              ? `<img src="${model.img}" alt="${escapeHtml(model.title)}">`
              : ''
          }
          <div class="surprise-meta">
            <div class="surprise-title">${escapeHtml(model.title)}</div>
            <div class="surprise-brand">${escapeHtml(model.brand)}</div>

            <div class="surprise-actions">
              <button type="button" class="modal-tool-btn" id="surpriseAgain">🎲 PROOVI UUESTI</button>
              <a class="surprise-link" href="${modelViewUrl(model)}">VAATA MUDELIT →</a>
            </div>
          </div>
        </div>
      `;

      document.getElementById('surpriseAgain')?.addEventListener('click', async () => {
        const data = await CollectionData.load();
        renderSurpriseModel(pick(data.models));
      });
    }

    document.getElementById('btnSurprise')?.addEventListener('click', async () => {
      const body = document.getElementById('surpriseBody');
      if (body) body.innerHTML = '<div class="loading">LAEN…</div>';

      try{
        const data = await CollectionData.load();
        if (!data.models.length) throw new Error('no-models');
        renderSurpriseModel(pick(data.models));
      }catch(e){
        if (body){
          body.innerHTML = '<div class="error">EI SAANUD MUDELIT VALIDA.</div>';
        }
      }
    });


    /* =========================
       KOGU KOLLEKTSIOONI OTSING
       ========================= */

    (() => {
      const input = document.getElementById('collectionSearch');
      const results = document.getElementById('searchResults');
      const summary = document.getElementById('searchSummary');

      if (!input || !results || !summary) return;

      let models = [];

      CollectionData.load()
        .then(data => { models = data.models; })
        .catch(() => {});

      function draw(){
        const q = input.value.trim().toLowerCase();

        if (!q){
          results.innerHTML = '';
          summary.textContent = 'ALUSTA KIRJUTAMIST';
          return;
        }

        const found = models.filter(it =>
          it.title.toLowerCase().includes(q) ||
          it.brand.toLowerCase().includes(q)
        );

        summary.textContent = found.length
          ? `LEITUD ${found.length}`
          : 'TULEMUSI EI LEITUD';

        results.innerHTML = found.slice(0, 50).map(it => `
          <a class="search-result" href="${modelViewUrl(it)}">
            ${
              it.img
                ? `<img src="${it.img}" alt="${escapeHtml(it.title)}" loading="lazy" decoding="async">`
                : ''
            }
            <div class="r-meta">
              <div class="r-title">${escapeHtml(it.title)}</div>
              <div class="r-brand">${escapeHtml(it.brand)}</div>
            </div>
          </a>
        `).join('');
      }

      input.addEventListener('input', draw);
    })();


    /* =========================
       PÄEVA MUDELID – ANNA 3 UUT
       ========================= */

    document.getElementById('btnDailyRefresh')?.addEventListener('click', async () => {
      try{
        const data = await CollectionData.load();
        renderDailyCards(pickRandomModels(data.models, 3));
      }catch{
        const grid = document.getElementById('dailyGrid');
        if (grid){
          grid.innerHTML = '<div class="error">EI SAANUD UUSI MUDELEID VALIDA.</div>';
        }
      }
    });


    /* =========================
       HTML TURVALINE TEKST
       ========================= */

    function escapeHtml(value){
      return String(value)
        .replaceAll('&','&amp;')
        .replaceAll('<','&lt;')
        .replaceAll('>','&gt;')
        .replaceAll('"','&quot;')
        .replaceAll("'","&#039;");
    }


    /* =========================
       KÄIVITUS
       ========================= */

    (async () => {
      try{
        const data = await CollectionData.load();

        renderFlipCounter(data.total);
        renderDaily(data.models);
        renderRanking(data.brands);

      }catch(e){
        console.error(e);

        renderFlipCounter(0);

        const dailyGrid = document.getElementById('dailyGrid');
        if (dailyGrid){
          dailyGrid.innerHTML =
            '<div class="error">ANDMEID EI SAANUD LAADIDA.</div>';
        }

        const rankingList = document.getElementById('rankingList');
        if (rankingList){
          rankingList.innerHTML =
            '<li><span class="error">ANDMEID EI SAANUD LAADIDA.</span></li>';
        }
      }
    })();
  </script>

</body>
</html>
